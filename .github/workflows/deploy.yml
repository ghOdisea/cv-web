name: Deploy to GitHub Pages

# Manual only until all content is reviewed and approved by the owner.
# After approval, add:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build -- --base-href /cv-web/

      # Serve index.html for unknown paths (single-page app)
      - run: cp dist/cv-web/browser/index.html dist/cv-web/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/cv-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
