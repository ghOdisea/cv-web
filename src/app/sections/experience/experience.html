<section id="experience" class="section" aria-labelledby="experience-title" *transloco="let t">
  <div class="container">
    <h2 id="experience-title" class="section__title">{{ t('experience.title') }}</h2>

    <ol role="list" class="roles">
      @for (r of tech(); track $index) {
        <li class="role">
          <ng-container *ngTemplateOutlet="roleTpl; context: { $implicit: r }" />
        </li>
      }
    </ol>

    <div class="groups">
      <ng-container *ngTemplateOutlet="groupTpl; context: { $implicit: hospitality() }" />
      <ng-container *ngTemplateOutlet="groupTpl; context: { $implicit: industry() }" />
    </div>
  </div>
</section>

<ng-template #groupTpl let-g>
  <details class="group card">
    <summary class="group__summary">
      <span>
        <strong>{{ g.summary }}</strong>
        <span class="muted group__hint">{{ g.hint }}</span>
      </span>
      <app-icon name="chevron" class="group__chevron" />
    </summary>

    <ol role="list" class="roles roles--compact">
      @for (r of g.items; track $index) {
        <li class="role">
          <ng-container *ngTemplateOutlet="roleTpl; context: { $implicit: r }" />
        </li>
      }
    </ol>
    @if (g.earlier) {
      <p class="group__earlier">
        <strong>{{ g.earlierTitle }}:</strong>{{ ' ' }}<span class="muted">{{ g.earlier }}</span>
      </p>
    }
  </details>
</ng-template>

<ng-template #roleTpl let-r>
  <p class="role__period">{{ r.period }}</p>
  <h3 class="role__title">
    {{ r.role }} <span class="role__company">· {{ r.company }}</span>
  </h3>
  <p class="role__text muted">{{ r.text }}</p>
</ng-template>
