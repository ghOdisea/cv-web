<section id="path" class="section" aria-labelledby="path-title" *transloco="let t">
  <div class="container">
    <h2 id="path-title" class="section__title">{{ t('path.title') }}</h2>

    <ol role="list" class="timeline">
      @for (m of milestones(); track $index; let last = $last) {
        <li class="timeline__item" [class.is-current]="last">
          <span class="timeline__dot" aria-hidden="true"></span>
          <p class="timeline__period">{{ m.period }}</p>
          <h3 class="timeline__title">{{ m.title }}</h3>
          <p class="timeline__text muted">{{ m.text }}</p>
        </li>
      }
    </ol>
  </div>
</section>
